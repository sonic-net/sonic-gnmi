# Azure DevOps YAML Template: Prepare a SONiC test environment
#
# Consolidates the preamble shared by every job that runs sonic-gnmi Go tests
# inside the sonic-slave container: checkout sonic-gnmi + sonic-mgmt-common +
# sonic-swss-common, install SONiC dependencies, and build sonic-mgmt-common
# (which generates Go code that sonic-gnmi imports via $(MGMT_COMMON_DIR)/build/yang).
#
# Usage:
#   - template: .azure/templates/setup-test-env.yml
#     parameters:
#       buildBranch: $(BUILD_BRANCH)
#       fetchDepth: 0            # optional; 0 means full history

parameters:
- name: buildBranch
  type: string
  default: $(BUILD_BRANCH)
- name: fetchDepth
  type: number
  default: 1

steps:
- checkout: self
  clean: true
  submodules: recursive
  fetchDepth: ${{ parameters.fetchDepth }}
  displayName: 'Checkout code'

- checkout: sonic-mgmt-common
  clean: true
  submodules: recursive
  displayName: 'Checkout sonic-mgmt-common'

- checkout: sonic-swss-common
  clean: true
  submodules: recursive
  displayName: 'Checkout sonic-swss-common'

- template: install-dependencies.yml
  parameters:
    buildBranch: ${{ parameters.buildBranch }}
    arch: amd64
    installTestDeps: true

- script: |
    set -exo pipefail
    mgmt_commit_before=$(git -C sonic-mgmt-common rev-parse HEAD)
    echo "sonic-mgmt-common exact commit (target-branch checkout) before build: $mgmt_commit_before"

    # Recorded for the post-build diagnostic below only (see far below):
    # this build's own Makefile ($(GO_DEPS) target) intentionally runs
    # `go mod tidy` before `go mod vendor`, which normalizes go.sum (a
    # TRACKED file) as standard MGMT build preparation - confirmed by
    # running it against this baseline, which rewrites go.sum even from a
    # clean checkout. A hard failure on any tracked-file change would
    # therefore be a false positive on every run, so this is not a gating
    # check; see the diagnostic-only comparison after the build.
    mgmt_status_before=$(git -C sonic-mgmt-common status --porcelain --untracked-files=no)

    pushd sonic-mgmt-common
    NO_TEST_BINS=1 dpkg-buildpackage -rfakeroot -b -us -uc
    popd

    # Exact-commit assertion (gating): the build must never move HEAD or
    # create a commit; it only normalizes/generates working-tree content.
    mgmt_commit_after=$(git -C sonic-mgmt-common rev-parse HEAD)
    if [ "$mgmt_commit_after" != "$mgmt_commit_before" ]; then
      echo "::error::sonic-mgmt-common HEAD moved during its own build: before=$mgmt_commit_before after=$mgmt_commit_after"
      exit 1
    fi
    echo "sonic-mgmt-common exact commit after build (unchanged): $mgmt_commit_after"

    # Tracked-file comparison (diagnostic only, NOT gating): this build's
    # `go mod tidy` step is expected to normalize go.mod/go.sum, and is the
    # standard MGMT build preparation that the existing GNMI build (`make
    # all`, via $(MGMT_COMMON_DIR)) already consumes as-is. Logging this
    # only documents what normalized/generated, it never fails the job.
    mgmt_status_after=$(git -C sonic-mgmt-common status --porcelain --untracked-files=no)
    if [ "$mgmt_status_before" != "$mgmt_status_after" ]; then
      echo "sonic-mgmt-common tracked-file normalization from this build (diagnostic only, expected, not gating):"
      git -C sonic-mgmt-common status --porcelain --untracked-files=no
      git -C sonic-mgmt-common diff
      echo "This is standard MGMT build preparation (e.g. 'go mod tidy' normalizing go.mod/go.sum, per Makefile's \$(GO_DEPS) target) at commit $mgmt_commit_after, already consumed as-is by the existing GNMI build below."
    else
      echo "No tracked-file normalization from this build."
    fi
  displayName: 'Build sonic-mgmt-common'
