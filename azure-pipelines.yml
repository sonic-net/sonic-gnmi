# sonic-gnmi Azure Pipelines definition
#
# Stage layout:
#   StaticChecks  - fast language-level checks (gofmt).
#   Test          - unit, memory-leak, and integration tests + coverage gate.
#   Package       - produce amd64 and arm64 .deb artifacts.
#
# Notes on naming (do not "fix"):
#   * The job `build` inside stage `Test` is deliberately kept with both
#     `job: build` and `displayName: "build"`. The pipeline decorator that
#     publishes the diff-coverage GitHub check derives its name as
#     `coverage.{BuildDefinitionName}.{Agent.JobName}`. `Agent.JobName`
#     resolves to the job displayName, so changing either value would
#     rename the required `coverage.sonic-net.sonic-gnmi.build` check.

trigger:
  branches:
    include:
    - master
    - 202???
    - 201???

pr:
  branches:
    include:
    - master
    - 202???
    - 201???

variables:
  - name: BUILD_BRANCH
    ${{ if eq(variables['Build.Reason'], 'PullRequest') }}:
      value: $(System.PullRequest.TargetBranch)
    ${{ else }}:
      value: $(Build.SourceBranchName)
  - name: UNIT_TEST_FLAG
    value: 'ENABLE_TRANSLIB_WRITE=y'
  - name: GO_VERSION
    value: '1.25.9'


resources:
  repositories:
  - repository: sonic-mgmt-common
    type: github
    name: sonic-net/sonic-mgmt-common
    endpoint: sonic-net
    ref: refs/heads/$(BUILD_BRANCH)
  - repository: sonic-swss-common
    type: github
    name: sonic-net/sonic-swss-common
    endpoint: sonic-net
    ref: refs/heads/$(BUILD_BRANCH)

stages:
- stage: StaticChecks
  displayName: "Static Checks"
  jobs:
  - job: go_static_checks
    displayName: "Go static checks"
    timeoutInMinutes: 10

    pool:
      vmImage: ubuntu-22.04

    steps:
    - checkout: self
      clean: true
      displayName: 'Checkout code'

    - template: .azure/templates/install-go.yml
      parameters:
        version: $(GO_VERSION)

    - bash: |
        set -euo pipefail
        export PATH=$PATH:/usr/local/go/bin
        mapfile -t files < <(find . -type f -name '*.go' \
            ! -path './vendor/*' ! -path './build/*' \
            ! -path './patches/*' ! -path './proto/*' \
            ! -path './swsscommon/*')
        bad=$(gofmt -l "${files[@]}")
        if [ -n "$bad" ]; then
          echo "::error::gofmt found unformatted Go file(s):"
          printf '  %s\n' $bad
          echo
          echo "----- gofmt diff (first 200 lines) -----"
          gofmt -d $bad | head -n 200
          echo "----------------------------------------"
          echo
          echo "Fix with: gofmt -w <file>, then commit the result."
          exit 1
        fi
        echo "All files properly formatted."
      displayName: 'gofmt'

- stage: Test
  displayName: "Test"
  dependsOn: [StaticChecks]
  jobs:
  # Fast pure package testing - no SONiC dependencies needed
  - job: pure_tests
    displayName: "Pure package tests"
    timeoutInMinutes: 15

    pool:
      vmImage: ubuntu-22.04

    steps:
    - checkout: self
      clean: true
      displayName: 'Checkout code'

    - checkout: sonic-mgmt-common
      clean: true
      displayName: 'Checkout sonic-mgmt-common'

    - template: .azure/templates/install-go.yml
      parameters:
        version: $(GO_VERSION)

    - bash: |
        set -euo pipefail
        export PATH=$PATH:/usr/local/go/bin:$(go env GOPATH)/bin
        cd sonic-gnmi
        go mod tidy
        make -f pure.mk junit-xml
      displayName: 'Run pure package tests'

    - task: PublishTestResults@2
      displayName: 'Publish pure package test results'
      condition: always()
      inputs:
        testResultsFormat: 'JUnit'
        testResultsFiles: '$(System.DefaultWorkingDirectory)/sonic-gnmi/test-results/junit-pure.xml'
        failTaskOnFailedTests: true
        publishRunAttachments: true
        testRunTitle: 'Pure package tests'

    - task: PublishCodeCoverageResults@2
      displayName: 'Publish pure package coverage'
      condition: always()
      inputs:
        summaryFileLocation: '$(System.DefaultWorkingDirectory)/sonic-gnmi/test-results/coverage-pure.xml'

    - publish: $(System.DefaultWorkingDirectory)/sonic-gnmi/test-results/coverage-pure.xml
      artifact: coverage-pure
      displayName: 'Publish pure coverage artifact'
      condition: always()

  # Memory leak testing with address sanitizer
  - job: memleak_tests
    displayName: "Memory-leak tests"
    timeoutInMinutes: 45

    pool:
      name: sonicso1ES-amd64
      vmImage: ubuntu-22.04

    container:
      image: sonicdev-microsoft.azurecr.io:443/sonic-slave-trixie:latest

    steps:
    - template: .azure/templates/setup-test-env.yml
      parameters:
        buildBranch: $(BUILD_BRANCH)

    - bash: |
        set -euo pipefail
        cd sonic-gnmi
        make all
        $(UNIT_TEST_FLAG) make check_memleak_junit
      displayName: 'Run memory-leak tests'

    - task: PublishTestResults@2
      displayName: 'Publish memory-leak test results'
      condition: always()
      inputs:
        testResultsFormat: 'JUnit'
        testResultsFiles: '$(System.DefaultWorkingDirectory)/sonic-gnmi/test-results/junit-memleak-standard.xml'
        failTaskOnFailedTests: true
        publishRunAttachments: true
        testRunTitle: 'Memory-leak tests'

  # Full integration testing with SONiC dependencies
  - job: integration_tests
    displayName: "Integration tests"
    timeoutInMinutes: 60

    pool:
      name: sonicso1ES-amd64
      vmImage: ubuntu-22.04

    container:
      image: sonicdev-microsoft.azurecr.io:443/sonic-slave-trixie:latest

    steps:
    - template: .azure/templates/setup-test-env.yml
      parameters:
        buildBranch: $(BUILD_BRANCH)
        fetchDepth: 0

    - bash: |
        set -euo pipefail
        # Ephemeral go.work module-graph proof (this step only, never
        # committed to either repository). This proves module-graph
        # resolution ONLY: that sonic-gnmi's and the selected
        # sonic-mgmt-common commit resolve together in a workspace, and that
        # github.com/Azure/sonic-mgmt-common binds to exactly that checkout.
        # setup-test-env.yml's MGMT build has already run by this point and
        # intentionally normalizes MGMT's working tree in place (its own
        # `go mod tidy` + `go mod vendor` step), so this proof runs against
        # that same post-build, normalized/generated MGMT checkout - not a
        # pristine, untouched target-branch checkout - at the exact commit
        # logged below (HEAD itself does not move; see setup-test-env.yml's
        # exact-commit assertion). It is NOT a substitute for, and does not
        # replace, the existing full build and tests below: `make all`
        # (which regenerates sonic-gnmi's gitignored vendor/ directory from
        # scratch via `go mod vendor` and applies both sonic-gnmi's own
        # patches and sonic-mgmt-common's patches/apply.sh against it) and
        # the integration test suite remain the real, gating validation
        # against the selected sonic-mgmt-common and are left unchanged.
        # This step does not compile any sonic-gnmi package directly under
        # the workspace.
        #
        # All directories are canonicalized with `realpath` so the later
        # comparison against `go list`'s resolved module directory can't
        # spuriously mismatch due to a symlink (e.g. a symlinked agent temp
        # or work directory) appearing on only one side.
        GNMI_DIR=$(realpath "$(pwd)/sonic-gnmi")
        MGMT_DIR=$(realpath "$(pwd)/sonic-mgmt-common")
        mgmt_commit=$(git -C "$MGMT_DIR" rev-parse HEAD)
        echo "sonic-mgmt-common exact commit for this module-graph proof: $mgmt_commit"

        WORKDIR="$(Agent.TempDirectory)/go-work-integration"
        mkdir -p "$WORKDIR"
        WORKDIR=$(realpath "$WORKDIR")
        GOWORK_FILE="$WORKDIR/go.work"
        cleanup() {
          rm -rf -- "$WORKDIR"
        }
        trap cleanup EXIT

        # Read directly from the file (no pipe from another process), so
        # this cannot trigger a SIGPIPE under `set -o pipefail` even though
        # it stops at the first match.
        go_directive=$(awk '$1=="go"{print $2; exit}' "$GNMI_DIR/go.mod")
        if [ -z "$go_directive" ]; then
          echo "::error::could not read the 'go' directive from $GNMI_DIR/go.mod"
          exit 1
        fi

        # Derive sonic-gnmi's own glog replacement from its committed go.mod
        # with no workspace in effect (GOWORK=off), rather than hardcoding
        # it: sonic-gnmi and sonic-mgmt-common replace github.com/golang/glog
        # with different versions for unrelated reasons, and go.work
        # requires exactly one resolved replacement for a module shared by
        # two `use`d modules. `go mod edit -json` only reads/parses go.mod;
        # it never writes. Kept as a single-line python invocation (no
        # embedded newlines) so this step's indentation stays valid YAML.
        # python3 reads all of stdin before printing, so this pipe cannot
        # SIGPIPE its producer either.
        gnmi_glog_new=$(GOWORK=off go mod edit -json "$GNMI_DIR/go.mod" | python3 -c 'import json,sys; d=json.load(sys.stdin); m=[x for x in (d.get("Replace") or []) if x["Old"]["Path"]=="github.com/golang/glog"]; print((m[0]["New"]["Path"]+("@"+m[0]["New"]["Version"] if m[0]["New"].get("Version") else "")) if m else "")')
        if [ -z "$gnmi_glog_new" ]; then
          echo "::error::sonic-gnmi/go.mod no longer replaces github.com/golang/glog; this proof's glog conflict-resolution assumption is stale and must be re-verified"
          exit 1
        fi
        echo "Resolving the ephemeral workspace's glog replacement to sonic-gnmi's own pin: $gnmi_glog_new"

        {
          echo "go ${go_directive}"
          echo
          echo "use ${GNMI_DIR}"
          echo "use ${MGMT_DIR}"
        } > "$GOWORK_FILE"
        export GOWORK="$GOWORK_FILE"
        go work edit -replace "github.com/golang/glog=${gnmi_glog_new}"

        echo "=== Ephemeral go.work (not committed to either repository): $GOWORK_FILE ==="
        cat "$GOWORK_FILE"

        # `go list -m all` lists the whole workspace's build list; the awk
        # filter never exits early, so it drains all of `go list`'s output
        # and cannot SIGPIPE it under `set -o pipefail`.
        echo "=== Module-graph proof: go list -m all under the ephemeral workspace ==="
        resolved_mgmt_dir=$(cd "$GNMI_DIR" && go list -m -f '{{.Path}} {{.Dir}}' all | awk '$1=="github.com/Azure/sonic-mgmt-common"{print $2}')
        if [ -z "$resolved_mgmt_dir" ]; then
          echo "::error::github.com/Azure/sonic-mgmt-common did not resolve in the workspace module graph (go list -m all)"
          exit 1
        fi
        resolved_mgmt_dir=$(realpath "$resolved_mgmt_dir")
        if [ "$resolved_mgmt_dir" != "$MGMT_DIR" ]; then
          echo "::error::github.com/Azure/sonic-mgmt-common resolved to $resolved_mgmt_dir, expected the checked-out $MGMT_DIR"
          exit 1
        fi
        echo "github.com/Azure/sonic-mgmt-common (commit $mgmt_commit) resolves to the checked-out sonic-mgmt-common: $resolved_mgmt_dir"
      displayName: 'Prove go.work module-graph resolution against selected sonic-mgmt-common'

    - bash: |
        set -euo pipefail
        cd sonic-gnmi
        make all
        $(UNIT_TEST_FLAG) make check_gotest_junit
      displayName: "Run integration tests"

    - task: PublishTestResults@2
      displayName: 'Publish integration test results'
      condition: always()
      inputs:
        testResultsFormat: 'JUnit'
        testResultsFiles: |
          $(System.DefaultWorkingDirectory)/sonic-gnmi/test-results/junit-integration-basic.xml
          $(System.DefaultWorkingDirectory)/sonic-gnmi/test-results/junit-integration-env.xml
          $(System.DefaultWorkingDirectory)/sonic-gnmi/test-results/junit-integration-dialout.xml
        failTaskOnFailedTests: true
        publishRunAttachments: true
        testRunTitle: 'Integration tests'

    - bash: |
        sudo pip3 install --quiet --break-system-packages --ignore-installed diff-cover
      displayName: 'Pre-install diff-cover for pipeline decorator'
      workingDirectory: $(System.DefaultWorkingDirectory)/sonic-gnmi

    - task: PublishCodeCoverageResults@2
      inputs:
        summaryFileLocation: '$(System.DefaultWorkingDirectory)/sonic-gnmi/coverage.xml'
      displayName: 'Publish coverage'

    - publish: $(System.DefaultWorkingDirectory)/sonic-gnmi/coverage.xml
      artifact: coverage-integration
      displayName: 'Publish integration coverage artifact'
      condition: succeeded()

  # Coverage aggregator. Job key AND displayName must both remain "build" so
  # the diff-coverage GitHub check stays named coverage.sonic-net.sonic-gnmi.build.
  - job: build
    displayName: "build"
    dependsOn: [pure_tests, integration_tests]
    condition: and(succeeded(), eq(variables['Build.Reason'], 'PullRequest'))
    timeoutInMinutes: 10

    pool:
      vmImage: ubuntu-22.04

    variables:
      DIFF_COVER_ENABLE: 'true'
      DIFF_COVER_CHECK_THRESHOLD: 80
      DIFF_COVER_WORKING_DIRECTORY: $(System.DefaultWorkingDirectory)
      DIFF_COVER_COVERAGE_FILES: '$(Pipeline.Workspace)/coverage-integration/coverage.xml $(Pipeline.Workspace)/coverage-pure/coverage-pure.xml'

    steps:
    - checkout: self
      clean: true
      fetchDepth: 0

    - download: current
      artifact: coverage-pure

    - download: current
      artifact: coverage-integration

- stage: Package
  displayName: "Package"
  dependsOn: [StaticChecks]
  jobs:
  - job: amd64
    displayName: "amd64 deb build"
    timeoutInMinutes: 60

    pool:
      name: sonicso1ES-amd64
      vmImage: ubuntu-22.04

    container:
      image: sonicdev-microsoft.azurecr.io:443/sonic-slave-trixie:latest

    steps:
    - template: .azure/templates/build-deb.yml
      parameters:
        buildBranch: $(BUILD_BRANCH)
        arch: amd64

  - job: arm64
    displayName: "arm64 deb build"
    timeoutInMinutes: 60

    pool:
      name: sonicso1ES-arm64

    container:
      image: sonicdev-microsoft.azurecr.io:443/sonic-slave-trixie:$(BUILD_BRANCH)-arm64

    steps:
    - template: .azure/templates/build-deb.yml
      parameters:
        buildBranch: $(BUILD_BRANCH)
        arch: arm64
        commonLibArtifact: common-lib.arm64
        swssCommonArtifact: sonic-swss-common-trixie.arm64
        publishArtifact: sonic-gnmi.arm64
