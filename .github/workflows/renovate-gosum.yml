# Renovate cannot update go.sum here: go.mod replaces sonic-mgmt-common with
# ../sonic-mgmt-common, which does not exist in Renovate's checkout. This job
# checks out sonic-mgmt-common beside sonic-gnmi, as azure-pipelines.yml does,
# runs go mod tidy, and commits the result to the Renovate branch.
#
# The commit is made through the GitHub API, so GitHub signs it; the merge robot
# merges a Renovate PR only when every commit on it is signed by GitHub. It is
# authored as github-actions[bot], which renovate.json lists in gitIgnoredAuthors
# so Renovate keeps managing the branch. A commit made with GITHUB_TOKEN starts
# no workflow runs, so CodeQL and Semgrep are dispatched on the new commit;
# workflow_dispatch is the exception to that rule.
#
# The job fails, and commits nothing, when tidy would not keep a requirement
# Renovate changed, or would bring back a module Renovate removed: a major
# update whose import paths the code does not use yet, for example. Committing
# that would undo the update, and Renovate would push it again, in a loop.
#
# It also fails, and commits nothing, when Renovate has twice in a row replaced
# the fixup with the same content it had before; once can be a rebase someone
# asked for. Renovate rebuilds its branch when it
# cannot apply its update to the branch as it stands: it finds each dependency
# by its line number in the base branch's go.mod, so a tidy that moves lines,
# on a base branch whose go.mod is not tidy, makes it rebuild the branch on
# every run. Committing again would start that loop over.

name: Renovate go.sum

on:
  pull_request:
    branches:
      - 'master'
      - '202[0-9][0-9][0-9]'

permissions:
  contents: read

jobs:
  tidy:
    if: >-
      github.event.pull_request.user.login == 'renovate[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.head_ref, 'renovate/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
      pull-requests: read
    steps:
      - name: Checkout sonic-gnmi
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.head_ref }}
          path: sonic-gnmi
          persist-credentials: false
          # The merge base with the base branch shows what Renovate changed
          fetch-depth: 0

      - name: Checkout sonic-mgmt-common
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: sonic-net/sonic-mgmt-common
          ref: ${{ github.base_ref }}
          path: sonic-mgmt-common
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: sonic-gnmi/go.mod
          cache: false

      - name: Tidy and commit
        working-directory: sonic-gnmi
        env:
          BRANCH: ${{ github.head_ref }}
          BASE: ${{ github.base_ref }}
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          # Fail rather than raise the go directive past the build container's Go
          GOTOOLCHAIN: local
        run: |
          set -euo pipefail
          # The last two force-pushes each replaced a fixup commit with the content that fixup was made on
          replaced=$(gh api graphql -F owner="${GITHUB_REPOSITORY%/*}" -F name="${GITHUB_REPOSITORY#*/}" -F number="${PR}" -f query='
            query($owner: String!, $name: String!, $number: Int!) {
              repository(owner: $owner, name: $name) { pullRequest(number: $number) {
                timelineItems(last: 2, itemTypes: [HEAD_REF_FORCE_PUSHED_EVENT]) { nodes { ... on HeadRefForcePushedEvent {
                  beforeCommit { oid author { email } parents(first: 1) { nodes { tree { oid } } } } } } } } } }' |
            jq -r --arg tree "$(git rev-parse 'HEAD^{tree}')" '[.data.repository.pullRequest.timelineItems.nodes[].beforeCommit
              | select(.author.email == "41898282+github-actions[bot]@users.noreply.github.com"
                       and .parents.nodes[0].tree.oid == $tree) | .oid] | select(length == 2) | last')
          if [ -n "${replaced}" ]; then
            echo "Renovate replaced the go.sum fixup ${replaced} with the same content it had before, so committing again would loop." >&2
            echo "Renovate rebuilds the branch when tidy moves lines in go.mod, which happens when ${BASE}'s go.mod is not tidy; tidy ${BASE}, then tick the rebase box on this pull request." >&2
            exit 1
          fi
          go_directive=$(sed -n 's/^go //p' go.mod)
          # Requirements and replacements in a go.mod, one per line
          requirements() {
            go mod edit -json "$1" | jq -r '
              (.Require // [])[] | "\(.Path) \(.Version)",
              ((.Replace // [])[] | "\(.Old.Path) \(.Old.Version // "") => \(.New.Path) \(.New.Version // "")")' | sort -u
          }
          modules() {
            go mod edit -json "$1" | jq -r '(.Require // [])[].Path' | sort -u
          }
          git show "$(git merge-base HEAD "origin/${BASE}")":go.mod > "${RUNNER_TEMP}/base.mod"
          changed=$(comm -13 <(requirements "${RUNNER_TEMP}/base.mod") <(requirements go.mod))
          removed=$(comm -23 <(modules "${RUNNER_TEMP}/base.mod") <(modules go.mod))
          go mod tidy
          if [ "$(sed -n 's/^go //p' go.mod)" != "${go_directive}" ]; then
            echo "go mod tidy changed the go directive from ${go_directive}; this update needs a newer Go than the build container has" >&2
            exit 1
          fi
          dropped=$(comm -23 <(echo "${changed}") <(requirements go.mod) | sed '/^$/d')
          returned=$(comm -12 <(echo "${removed}") <(modules go.mod) | sed '/^$/d')
          if [ -n "${dropped}${returned}" ]; then
            printf 'go mod tidy does not keep this update, so the code needs changing with it\n' >&2
            [ -z "${dropped}" ] || printf 'Requirements tidy removes:\n%s\n' "${dropped}" >&2
            [ -z "${returned}" ] || printf 'Modules the update removed, which tidy requires again:\n%s\n' "${returned}" >&2
            exit 1
          fi
          if ! git diff --quiet -- go.mod go.sum; then
            # expectedHeadOid fails the commit if Renovate moved the branch meanwhile
            jq -n --arg repo "${GITHUB_REPOSITORY}" --arg branch "${BRANCH}" --arg head "$(git rev-parse HEAD)" \
              --rawfile mod <(base64 -w0 go.mod) --rawfile sum <(base64 -w0 go.sum) '{
                query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid } } }",
                variables: { input: {
                  branch: { repositoryNameWithOwner: $repo, branchName: $branch },
                  expectedHeadOid: $head,
                  message: {
                    headline: "Update go.sum",
                    body: "Signed-off-by: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
                  },
                  fileChanges: { additions: [ { path: "go.mod", contents: $mod }, { path: "go.sum", contents: $sum } ] }
                } }
              }' | gh api graphql --input -
          elif [ "$(git log -1 --format=%ae)" != '41898282+github-actions[bot]@users.noreply.github.com' ]; then
            echo "go.mod and go.sum are already tidy"
            exit 0
          fi
          # The head is now a fixup commit: this run's, or that of an earlier run that
          # failed or was canceled before dispatching, so a rerun dispatches as well
          gh workflow run -R "${GITHUB_REPOSITORY}" codeql-analysis.yml --ref "${BRANCH}" -f build_branch="${BASE}"
          gh workflow run -R "${GITHUB_REPOSITORY}" semgrep.yml --ref "${BRANCH}"
