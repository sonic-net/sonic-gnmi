# Renovate cannot update go.sum here: go.mod replaces sonic-mgmt-common with
# ../sonic-mgmt-common, which does not exist in Renovate's checkout. This job
# checks out sonic-mgmt-common beside sonic-gnmi, as azure-pipelines.yml does,
# runs go mod tidy, and commits the result to the Renovate branch.
#
# Go runs in the sonic-slave container for the base branch, with
# GOTOOLCHAIN=local, as in azure-pipelines.yml. Tidy raises the go directive
# when an update needs a newer Go, and fails when the container's Go is too old.
#
# The commit is made through the GitHub API, so GitHub signs it; the merge robot
# merges a Renovate PR only when every commit on it is signed by GitHub. The
# commit's pull_request runs wait for approval, since github-actions[bot] is not
# a collaborator, and the merge robot approves them.
#
# Any workflow with a contents: write token can make a commit authored by
# github-actions[bot] and signed by GitHub, so that alone does not show this job
# made it. The job uploads an artifact named renovate-fixup-<commit>, which only
# this run can do: the merge robot accepts a github-actions[bot] commit only when
# a run that Renovate's push of the commit before it started, for this PR, has
# recorded it that way.
#
# The commit is authored as github-actions[bot], so Renovate treats the branch
# as edited and stops updating it. Renovate checks a branch it still manages
# against its own update, finding each dependency by its line number in the
# base branch's go.mod, and rebuilds the branch when a tidy has moved lines;
# the rebuilt branch would start this job again, in a loop. Renovate rebuilds
# an edited branch only when someone ticks the rebase box on the PR.
#
# The job fails, and commits nothing, when tidy would remove or lower a
# requirement Renovate changed, or would bring back a module Renovate removed: a
# major update whose import paths the code does not use yet, for example.
# Committing that would undo the update. Tidy raising a requirement further, for
# another module that needs it, keeps the update.

name: Renovate go.sum

on:
  pull_request:
    branches:
      - 'master'
      - '202[0-9][0-9][0-9]'

permissions:
  contents: read

jobs:
  tidy:
    # Only on Renovate's own push: the merge robot accepts a fixup only from such a run
    if: >-
      github.event.pull_request.user.login == 'renovate[bot]' &&
      github.actor == 'renovate[bot]' && github.triggering_actor == 'renovate[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.head_ref, 'renovate/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout sonic-gnmi
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The commit Renovate pushed; the fixup fails if the branch has moved since
          ref: ${{ github.event.pull_request.head.sha }}
          path: sonic-gnmi
          persist-credentials: false
          # The merge base with the base branch shows what Renovate changed
          fetch-depth: 0

      - name: Checkout sonic-mgmt-common
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: sonic-net/sonic-mgmt-common
          ref: ${{ github.base_ref }}
          path: sonic-mgmt-common
          persist-credentials: false

      - name: Pull the build container
        env:
          IMAGE: sonicdev-microsoft.azurecr.io/sonic-slave-trixie:${{ github.base_ref }}
        run: docker pull --quiet "${IMAGE}"

      - name: Tidy and commit
        id: tidy
        working-directory: sonic-gnmi
        env:
          BRANCH: ${{ github.head_ref }}
          BASE: ${{ github.base_ref }}
          GH_TOKEN: ${{ github.token }}
          IMAGE: sonicdev-microsoft.azurecr.io/sonic-slave-trixie:${{ github.base_ref }}
        run: |
          set -euo pipefail
          # The build container's Go, on the same paths as here
          go() {
            docker run --rm --user "$(id -u):$(id -g)" \
              -e HOME="${RUNNER_TEMP}" -e GOTOOLCHAIN=local -e GOFLAGS=-modcacherw \
              -v "${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE}" -v "${RUNNER_TEMP}:${RUNNER_TEMP}" \
              -w "${PWD}" "${IMAGE}" go "$@"
          }
          # Requirements and replacements in a go.mod, one per line
          requirements() {
            go mod edit -json "$1" | jq -r '
              ((.Require // [])[] | "\(.Path) \(.Version)"),
              ((.Replace // [])[] | "\(.Old.Path) \(.Old.Version // "") => \(.New.Path) \(.New.Version // "")")' | sort -u
          }
          # Succeeds if Go module version $1 is lower than $2 (semver precedence:
          # a prerelease or pseudo-version sorts below its release; sort -V does not)
          lower() {
            python3 -I - "$1" "$2" <<'PY'
          import sys
          def key(v):
              core, _, pre = v.lstrip("v").split("+")[0].partition("-")
              ids = tuple((0, int(i), "") if i.isdigit() else (1, 0, i) for i in pre.split(".")) if pre else ()
              return tuple(int(x) for x in core.split(".")), not pre, ids
          sys.exit(0 if key(sys.argv[1]) < key(sys.argv[2]) else 1)
          PY
          }
          modules() {
            go mod edit -json "$1" | jq -r '(.Require // [])[].Path' | sort -u
          }
          git show "$(git merge-base HEAD "origin/${BASE}")":go.mod > "${RUNNER_TEMP}/base.mod"
          changed=$(comm -13 <(requirements "${RUNNER_TEMP}/base.mod") <(requirements go.mod))
          removed=$(comm -23 <(modules "${RUNNER_TEMP}/base.mod") <(modules go.mod))
          go mod tidy
          after=$(requirements go.mod)
          dropped=$(echo "${changed}" | while IFS= read -r line; do
            [ -n "${line}" ] || continue
            # A replacement stays as Renovate set it
            case "${line}" in *" => "*) grep -qxF -- "${line}" <<<"${after}" || echo "${line}"; continue ;; esac
            read -r path version <<<"${line}"
            now=$(awk -v p="${path}" '$1 == p && NF == 2 { print $2 }' <<<"${after}")
            if [ -z "${now}" ] || lower "${now}" "${version}"; then
              echo "${path} ${version}"
            fi
          done)
          returned=$(comm -12 <(echo "${removed}") <(modules go.mod) | sed '/^$/d')
          if [ -n "${dropped}${returned}" ]; then
            printf 'go mod tidy does not keep this update, so the code needs changing with it\n' >&2
            [ -z "${dropped}" ] || printf 'Requirements tidy removes or lowers:\n%s\n' "${dropped}" >&2
            [ -z "${returned}" ] || printf 'Modules the update removed, which tidy requires again:\n%s\n' "${returned}" >&2
            exit 1
          fi
          if git diff --quiet -- go.mod go.sum; then
            echo "go.mod and go.sum are already tidy"
            exit 0
          fi
          # expectedHeadOid fails the commit if Renovate moved the branch meanwhile
          oid=$(jq -n --arg repo "${GITHUB_REPOSITORY}" --arg branch "${BRANCH}" --arg head "$(git rev-parse HEAD)" \
              --rawfile mod <(base64 -w0 go.mod) --rawfile sum <(base64 -w0 go.sum) '{
                query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid } } }",
                variables: { input: {
                  branch: { repositoryNameWithOwner: $repo, branchName: $branch },
                  expectedHeadOid: $head,
                  message: {
                    headline: "Update go.sum",
                    body: "Signed-off-by: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
                  },
                  fileChanges: { additions: [ { path: "go.mod", contents: $mod }, { path: "go.sum", contents: $sum } ] }
                } }
              }' | gh api graphql --input - --jq '.data.createCommitOnBranch.commit.oid')
          echo "${oid}" > "${RUNNER_TEMP}/fixup"
          echo "oid=${oid}" >> "${GITHUB_OUTPUT}"

      # The merge robot accepts the fixup only with this run's record of it
      - name: Record the fixup commit
        if: steps.tidy.outputs.oid != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: renovate-fixup-${{ steps.tidy.outputs.oid }}
          path: ${{ runner.temp }}/fixup
          retention-days: 90
