# For more infomation, please visit: https://github.com/github/codeql-action

name: "CodeQL"

on:
  push:
    branches:
      - 'master'
      - '202[0-9][0-9][0-9]'
  pull_request_target:
    branches:
      - 'master'
      - '202[0-9][0-9][0-9]'
  workflow_dispatch:
    inputs:
      build_branch:
        description: 'Branch of sonic-mgmt-common to build against, when the dispatched ref has no counterpart there'
        required: false
        type: string

env:
  BUILD_BRANCH: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.base.ref || inputs.build_branch || github.ref_name }}


jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'go' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    # The go directive, which azure-pipelines.yml keeps within the build container's Go
    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod

    # Checkout sonic-mgmt-common repository which is used by sonic-gnmi
    - name: Checkout sonic-mgmt-common repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        repository: sonic-net/sonic-mgmt-common
        path: sonic-mgmt-common
        ref: refs/heads/${{ env.BUILD_BRANCH }}

    # go.mod requires a published sonic-mgmt-common. Analyze against the checkout
    # above instead, as the Makefile builds against the one beside this repository.
    - name: Use the sonic-mgmt-common checkout
      run: go mod edit -replace github.com/Azure/sonic-mgmt-common=./sonic-mgmt-common

    # Initializes the CodeQL tools for scanning.
    - name: Initialize CodeQL
      uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
      with:
        config-file: ./.github/codeql/codeql-config.yml
        languages: ${{ matrix.language }}

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
      with:
        category: "/language:${{matrix.language}}"
