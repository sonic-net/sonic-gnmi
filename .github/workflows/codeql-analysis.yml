# For more infomation, please visit: https://github.com/github/codeql-action

name: "CodeQL"

on:
  push:
    branches:
      - 'master'
      - '202[0-9][0-9][0-9]'
  pull_request_target:
    branches:
      - 'master'
      - '202[0-9][0-9][0-9]'
  workflow_dispatch:
    inputs:
      build_branch:
        description: 'Branch of sonic-mgmt-common to build against, when the dispatched ref has no counterpart there'
        required: false
        type: string

env:
  BUILD_BRANCH: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.base.ref || inputs.build_branch || github.ref_name }}


jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'go' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version: '1.25'

    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
      with:
        go-version: '1.25'

    # Checkout sonic-mgmt-common repository which is used by sonic-gnmi
    - name: Checkout sonic-mgmt-common repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        repository: sonic-net/sonic-mgmt-common
        path: sonic-mgmt-common
        ref: refs/heads/${{ env.BUILD_BRANCH }}

    # Update go.mod to use local sonic-mgmt-common.
    # This is the same hack used in the CI pipeline. See lgtm.yml.
    # We should find a better way to do this.
    - name: Update go.mod for sonic-mgmt-common
      run: sed -i 's@github.com/Azure/sonic-mgmt-common => ../sonic-mgmt-common@github.com/Azure/sonic-mgmt-common => ./sonic-mgmt-common@g' go.mod

    # Initializes the CodeQL tools for scanning.
    - name: Initialize CodeQL
      uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
      with:
        config-file: ./.github/codeql/codeql-config.yml
        languages: ${{ matrix.language }}

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
      with:
        category: "/language:${{matrix.language}}"
